chapter: ch23
topic: optimization
questions:
  - id: optimization-001
    domain: 4
    task: "4.3"
    difficulty: 3
    question: |
      A CPU-bound function must respond in under 400 ms. Load tests give these average durations: 256 MB → 1,600 ms,
      512 MB → 700 ms, 1,024 MB → 330 ms, 2,048 MB → 300 ms. Lambda bills memory × duration. Which memory setting
      meets the target at the LOWEST cost per invocation?
    options:
      A: "1,024 MB"
      B: "256 MB"
      C: "512 MB"
      D: "2,048 MB"
    answer: [A]
    explanation: |
      GB-seconds per invocation: 0.25 × 1.6 = 0.40, 0.5 × 0.7 = 0.35, 1 × 0.33 = 0.33, 2 × 0.3 = 0.60. Only
      1,024 MB and 2,048 MB meet 400 ms, and 1,024 MB is cheaper (it is even the cheapest overall). More memory
      also means more CPU (exercise opt_1).
      B and C are too slow.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-002
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A company runs 300 Lambda functions and wants memory size recommendations based on their actual utilization,
      without writing test payloads or running experiments for each function. Which service should it use?
    options:
      A: "AWS Config."
      B: "AWS CloudTrail."
      C: "AWS Compute Optimizer."
      D: "AWS X-Ray."
    answer: [C]
    explanation: |
      Compute Optimizer analyzes the utilization of functions (and EC2, EBS, ECS on Fargate) and recommends
      memory sizes. Lambda Power Tuning is excellent for one function, but requires running it with test
      payloads.
      A tracks configuration changes.
      B records API calls.
      D traces requests.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-003
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A multilingual website is served through CloudFront. The origin chooses the page language from the
      Accept-Language header. English-speaking users sometimes receive French pages. Which change fixes this while
      keeping a good cache hit ratio?
    options:
      A: "Invalidate the whole distribution every hour."
      B: "Forward Accept-Language to the origin with an origin request policy only."
      C: "Set all TTLs to 0."
      D: "Include Accept-Language in the cache key through the cache policy, normalized to the few supported languages."
    answer: [D]
    explanation: |
      A header that changes the response must be part of the cache key, otherwise one variant is served to
      everyone. Normalizing values (for example with a CloudFront Function) keeps the number of variants small
      (exercise opt_2).
      A and C sacrifice caching without fixing the cache key.
      B sends the header to the origin but does not separate cached variants.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-004
    domain: 4
    task: "4.3"
    difficulty: 3
    question: |
      The origin of a CloudFront distribution returns different HTML for mobile and desktop browsers. A developer
      added the User-Agent header to the cache key, and the cache hit ratio dropped from 85% to 3%. What should
      the developer do?
    options:
      A: "Disable caching for HTML pages."
      B: "Add the Authorization header to the cache key too."
      C: "Keep User-Agent in the cache key and increase the TTLs."
      D: "Remove User-Agent from the cache key and include the CloudFront-Is-Mobile-Viewer and CloudFront-Is-Desktop-Viewer headers instead."
    answer: [D]
    explanation: |
      User-Agent has thousands of distinct values, so almost every request misses. The device-type headers
      generated by CloudFront have only a few values, which keeps the hit ratio high.
      A gives up on caching.
      B makes keys even more unique.
      C: longer TTLs do not help when keys are almost unique.
    refs: [book/src/ch23-optimization.md, book/src/ch08-caching-databases-cdn.md]

  - id: optimization-005
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      Lambda functions in private subnets read and write several terabytes per month to S3 and DynamoDB through a
      NAT gateway, and NAT data processing charges are high. Which change reduces cost with no code change?
    options:
      A: "Add gateway VPC endpoints for S3 and DynamoDB to the private subnets' route tables."
      B: "Add a second NAT gateway."
      C: "Move the functions to public subnets."
      D: "Enable S3 Transfer Acceleration."
    answer: [A]
    explanation: |
      Gateway endpoints for S3 and DynamoDB have no hourly or data processing charges, and the SDK keeps using
      the same endpoints.
      B adds cost.
      C: Lambda functions in a VPC never get public IP addresses, so they would lose internet access.
      D speeds up long-distance transfers and costs extra.
    refs: [book/src/ch23-optimization.md, book/src/ch05-lambda.md]

  - id: optimization-006
    domain: 4
    task: "4.3"
    difficulty: 1
    question: |
      A team wants to reduce the compute cost of its Python Lambda functions, which have no native dependencies,
      with a one-line configuration change and similar or better performance. What should it change?
    options:
      A: "Reduce the timeout to 1 second."
      B: "Move the code into a container image."
      C: "Set the functions' architecture to arm64 (Graviton)."
      D: "Enable provisioned concurrency."
    answer: [C]
    explanation: |
      arm64 has a lower price per GB-second than x86_64. Pure Python code usually runs unchanged, while native
      dependencies must be rebuilt for arm64.
      A causes failures.
      B does not change pricing.
      D adds cost for pre-initialized environments.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-007
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      An order function synchronously invokes a payment function, which synchronously invokes a fraud-check
      function and waits for its result. The team pays for the waiting time of every function, and timeouts
      cascade. Which design is BEST?
    options:
      A: "Add more memory to all three functions."
      B: "Merge the three functions into one."
      C: "Increase every function's timeout to 15 minutes."
      D: "Orchestrate the steps with a Step Functions workflow that calls each function, with retries and error handling."
    answer: [D]
    explanation: |
      With an orchestrator, no function waits for another, and the workflow handles retries, timeouts and
      errors. Standard workflows are billed per state transition, not for waiting time.
      A does not remove the waiting.
      B couples unrelated concerns.
      C makes cascading waits longer.
    refs: [book/src/ch23-optimization.md, book/src/ch10-streaming-orchestration.md]

  - id: optimization-008
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      An application on EC2, in the same Region as its bucket, downloads 5 GB objects with a single GET request
      each, and the downloads are slow. How can it improve download throughput?
    options:
      A: "Move the objects to S3 Glacier Instant Retrieval."
      B: "Enable versioning on the bucket."
      C: "Fetch byte ranges of each object in parallel (Range header) and reassemble them."
      D: "Enable S3 Transfer Acceleration."
    answer: [C]
    explanation: |
      Parallel byte-range GETs use several connections at once, which increases throughput (multipart upload
      does the same for uploads).
      A and B do not increase throughput.
      D speeds up long-distance transfers through edge locations, not same-Region ones.
    refs: [book/src/ch23-optimization.md, book/src/ch04-s3.md]

  - id: optimization-009
    domain: 4
    task: "4.3"
    difficulty: 3
    question: |
      A read-heavy DynamoDB workload consumes too many read capacity units. Which changes reduce the RCUs consumed?
      (Choose TWO.)
    options:
      A: "Keep the same Scan but lower its Limit parameter."
      B: "Set ConsistentRead=True on every read."
      C: "Add a ProjectionExpression that returns fewer attributes."
      D: "Use eventually consistent reads where the application tolerates slightly stale data."
      E: "Replace Scan operations with Query operations on a key or GSI that matches the access pattern."
    answer: [D, E]
    explanation: |
      Eventually consistent reads cost half as much as strongly consistent reads, and a Query reads only
      matching items, unlike a Scan.
      A reads the same items over more pages.
      B doubles the cost.
      C reduces the response size, but capacity is computed on the full items read.
    refs: [book/src/ch23-optimization.md, book/src/ch07-dynamodb.md]

  - id: optimization-010
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A company's Lambda and Fargate usage is steady and predictable around the clock, and it plans to keep it for
      years. How can it reduce compute costs without changing the architecture?
    options:
      A: "Purchase a Compute Savings Plan for a committed hourly spend."
      B: "Switch the functions to provisioned concurrency."
      C: "Use Fargate Spot for every task, including critical ones."
      D: "Buy EC2 Reserved Instances for the Lambda functions."
    answer: [A]
    explanation: |
      Compute Savings Plans give discounts on EC2, Fargate and Lambda usage in exchange for a 1-year or 3-year
      commitment.
      B adds charges for pre-initialized environments.
      C: Spot tasks can be interrupted, which does not suit critical workloads.
      D: Reserved Instances do not apply to Lambda.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-011
    domain: 4
    task: "4.3"
    difficulty: 3
    question: |
      IoT devices send 100-byte records to a Kinesis data stream at 20,000 records per second, about 2 MB/s in total.
      The stream needs 20 shards because of the per-shard record limit. How can the team reduce the number of
      shards?
    options:
      A: "Increase the retention period."
      B: "Aggregate many small user records into each Kinesis record with the Kinesis Producer Library (KPL), and deaggregate on the consumer side."
      C: "Use a random partition key."
      D: "Enable enhanced fan-out."
    answer: [B]
    explanation: |
      Each shard accepts 1,000 records or 1 MB per second. With aggregation, many user records fit in one
      Kinesis record, so the bandwidth limit (about 2 to 3 shards here) becomes the constraint.
      A is unrelated.
      C spreads records but does not reduce the record count.
      D adds read throughput.
    refs: [book/src/ch23-optimization.md, book/src/ch10-streaming-orchestration.md]

  - id: optimization-012
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A team wants per-function CPU time, memory utilization, network usage and cold start metrics in CloudWatch
      dashboards with minimal effort. What should it enable?
    options:
      A: "AWS Config rules for Lambda."
      B: "VPC Flow Logs."
      C: "CloudWatch Lambda Insights on the functions."
      D: "CloudTrail data events for Lambda."
    answer: [C]
    explanation: |
      Lambda Insights collects system-level metrics through a Lambda extension and provides prebuilt dashboards.
      A evaluates configurations.
      B records network flows.
      D records Invoke API calls.
    refs: [book/src/ch23-optimization.md]

  - id: optimization-013
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A Lambda function consuming an SQS queue is invoked about 50 times per second with only 1 or 2 messages each
      time. A few seconds of extra latency are acceptable. How can the developer reduce the number of invocations?
    options:
      A: "Set the function's reserved concurrency to 0."
      B: "Switch the queue to short polling."
      C: "Reduce the queue's visibility timeout."
      D: "Increase the event source mapping's batch size and set a maximum batching window (MaximumBatchingWindowInSeconds)."
    answer: [D]
    explanation: |
      With a batching window, the poller gathers records until the batch is full or the window expires, so each
      invocation processes more messages.
      A stops all invocations.
      B: Lambda already manages polling and this does not batch.
      C causes duplicate processing.
    refs: [book/src/ch23-optimization.md, book/src/ch05-lambda.md]
