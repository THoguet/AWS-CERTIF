chapter: ch06
topic: apigw
questions:
  - id: apigw-001
    domain: 4
    task: "4.1"
    difficulty: 2
    question: |
      After refactoring, a Lambda function behind an API Gateway REST API (Lambda proxy integration) returns
      the Python dict {"orders": [...]} directly. Clients now receive HTTP 502 Bad Gateway. What is the fix?
    options:
      A: "Return {\"statusCode\": 200, \"headers\": {...}, \"body\": json.dumps({\"orders\": [...]})}."
      B: "Increase the API Gateway integration timeout."
      C: "Grant API Gateway permission to invoke the function."
      D: "Enable API caching on the stage."
    answer: [A]
    explanation: |
      Proxy integrations expect an object with statusCode, optional headers, and body as a STRING. Anything
      else is a malformed response, which gives 502.
      B: a timeout gives 504.
      C: a permission problem gives 500, and the function was invoked anyway.
      D is unrelated.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-002
    domain: 1
    task: "1.1"
    difficulty: 2
    question: |
      A report generation endpoint behind API Gateway takes 45 to 90 seconds. Clients receive 504 errors.
      Which design should the developer implement?
    options:
      A: "Accept the request, enqueue the job (SQS or Step Functions), return 202 with a job ID, and let the client poll a status endpoint or receive a notification."
      B: "Switch from a REST API to an HTTP API."
      C: "Enable API Gateway caching."
      D: "Increase the Lambda timeout to 15 minutes."
    answer: [A]
    explanation: |
      The integration timeout (29 s by default for REST, 30 s for HTTP APIs) is hit, so long work must be made
      asynchronous.
      B: HTTP APIs have a similar limit.
      C does not help first requests.
      D: the Lambda timeout does not change API Gateway's integration timeout.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-003
    domain: 3
    task: "3.4"
    difficulty: 2
    question: |
      A REST API has dev and prod stages. The dev stage must invoke the Lambda alias "dev" and the prod stage
      the alias "prod", using a single API definition. Which steps are required? (Choose TWO.)
    options:
      A: "Create a separate REST API per environment with a hard-coded alias."
      B: "Configure a usage plan per stage."
      C: "Add a resource-based permission on each alias allowing API Gateway to invoke it."
      D: "Use ${stageVariables.lambdaAlias} in the Lambda integration URI and set lambdaAlias per stage."
      E: "Point the integration to $LATEST and use environment variables."
    answer: [C, D]
    explanation: |
      Stage variables make one integration resolve to different aliases per stage. API Gateway needs
      lambda:InvokeFunction on each alias (add-permission with a qualifier).
      A works but duplicates the API.
      B is for throttling and quotas.
      E does not separate environments.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-004
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A company sells access to its REST API in tiers: Basic (100 requests/day) and Premium (10,000
      requests/day, higher rate). Each customer must be metered separately. Which features should be used?
    options:
      A: "A WAF rate-based rule per customer."
      B: "Lambda reserved concurrency per customer."
      C: "Usage plans with throttling and quotas, and one API key per customer associated with the right plan."
      D: "A separate stage per customer."
    answer: [C]
    explanation: |
      Usage plans define rate, burst and quota limits. API keys identify customers and attach them to a plan.
      Callers over the limit receive 429.
      A, B and D do not meter per customer in a manageable way.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-005
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A GET /products/{id} endpoint on a REST API receives thousands of identical requests per minute, and
      product data changes rarely. The team wants to cut Lambda invocations and latency with the LEAST effort.
      What should they do?
    options:
      A: "Use provisioned concurrency."
      B: "Enable API Gateway caching on the stage with an appropriate TTL, with the id path parameter as part of the cache key."
      C: "Increase the Lambda memory."
      D: "Add an ElastiCache cluster in front of the Lambda function."
    answer: [B]
    explanation: |
      Stage caching returns cached responses without calling the backend. The TTL defaults to 300 s, with a
      maximum of 3,600 s. The path parameter must be in the cache key so that each product is cached separately.
      A and C do not reduce invocations.
      D requires code and infrastructure changes.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-006
    domain: 2
    task: "2.1"
    difficulty: 3
    question: |
      API caching is enabled on a public API. The team notices that some clients send
      "Cache-Control: max-age=0" on every request, which bypasses the cache and overloads the backend. How can
      they prevent this?
    options:
      A: "Set the cache TTL to 0."
      B: "Add a usage plan."
      C: "Disable caching for GET methods."
      D: "Require authorization to invalidate cache entries, so that only principals with execute-api:InvalidateCache can bypass the cache."
    answer: [D]
    explanation: |
      Requiring authorization for cache invalidation makes API Gateway ignore (or reject) the header from
      unauthorized clients.
      A and C remove the cache.
      B throttles but still bypasses the cache.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-007
    domain: 1
    task: "1.1"
    difficulty: 2
    question: |
      A POST /orders endpoint must reject requests whose JSON body is missing required fields, without
      invoking the backend Lambda function. What should the developer configure?
    options:
      A: "An integration response mapping template."
      B: "A Lambda authorizer that parses the body."
      C: "A request validator on the method with a model (JSON Schema) for the request body."
      D: "A WAF rule inspecting the body."
    answer: [C]
    explanation: |
      REST API request validation checks the body against a model, and required parameters and headers, then
      returns 400 before calling the integration.
      A transforms responses.
      B: authorizers are for authentication and authorization.
      D: WAF targets attacks, not schema validation.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-008
    domain: 2
    task: "2.1"
    difficulty: 1
    question: |
      Users of a web app sign in with an Amazon Cognito user pool. The REST API must only accept requests with
      a valid token from that pool, with no custom code. What should the developer configure on the API?
    options:
      A: "IAM authorization with SigV4."
      B: "A resource policy allowing the user pool ARN."
      C: "A Cognito user pool authorizer."
      D: "API keys."
    answer: [C]
    explanation: |
      The Cognito user pool authorizer validates the JWT (signature, expiry, audience/scopes) automatically.
      A requires AWS credentials.
      B: resource policies do not validate JWTs.
      D: API keys are not authentication.
    refs: [book/src/ch06-api-gateway-appsync.md, book/src/ch12-cognito.md]

  - id: apigw-009
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      An API must accept bearer tokens issued by a legacy in-house identity system (not OIDC compliant). Each
      token must be validated by calling the identity system's API. Which authorization option fits?
    options:
      A: "A Lambda authorizer (TOKEN type) that validates the token and returns an IAM policy, with result caching enabled."
      B: "Mutual TLS."
      C: "A Cognito user pool authorizer."
      D: "A JWT authorizer on an HTTP API."
    answer: [A]
    explanation: |
      Lambda authorizers run custom validation logic. Caching the result per token reduces calls to the
      legacy system.
      B authenticates client certificates, not bearer tokens.
      C and D only validate Cognito or OIDC JWTs.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-010
    domain: 4
    task: "4.1"
    difficulty: 3
    question: |
      A Lambda authorizer returns an Allow policy for the exact methodArn of the request, and authorizer caching
      is enabled with a 300-second TTL. Users can call GET /orders, but their next call to GET /profile within
      a few minutes returns 403. Why?
    options:
      A: "The Cognito token expired."
      B: "GET /profile requires an API key."
      C: "The cached policy only allows the first method/resource, and API Gateway reuses it for the same token on other resources."
      D: "The authorizer has a timeout of 3 seconds."
    answer: [C]
    explanation: |
      With caching, the policy returned for the first call applies to later calls with the same token. Return a
      policy covering every needed resource (e.g. arn:...:api/stage/*/*), or disable caching.
      A and B do not match the pattern of the symptom.
      D would fail the first call too.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-011
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A startup needs a simple HTTP front end for Lambda functions, authorized with JWTs from their OIDC
      provider, at the lowest cost and latency. They need no API keys, caching or request validation. What
      should they choose?
    options:
      A: "An API Gateway HTTP API with a JWT authorizer."
      B: "AWS AppSync."
      C: "An API Gateway WebSocket API."
      D: "An API Gateway REST API with a Lambda authorizer."
    answer: [A]
    explanation: |
      HTTP APIs are cheaper and faster than REST APIs, and include a native JWT authorizer for OIDC/OAuth2.
      B is for GraphQL.
      C is for persistent two-way connections.
      D is more expensive and needs authorizer code.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-012
    domain: 3
    task: "3.2"
    difficulty: 1
    question: |
      A front-end team must start integrating with a new /invoices API whose backend will only be ready in three
      weeks. The response format is already agreed. How can the backend team unblock them quickly?
    options:
      A: "Create the resources and methods with mock integrations that return the agreed sample responses, and deploy them to a dev stage."
      B: "Share the production API key."
      C: "Ask the front-end team to wait for the backend."
      D: "Deploy an empty Lambda function returning 200 with no body."
    answer: [A]
    explanation: |
      Mock integrations return static responses from API Gateway itself, with no backend needed, which is
      ideal for contract-first development and testing.
      B is insecure and irrelevant.
      C blocks the team.
      D does not follow the contract.
    refs: [book/src/ch06-api-gateway-appsync.md, book/src/ch19-testing.md]

  - id: apigw-013
    domain: 3
    task: "3.4"
    difficulty: 2
    question: |
      A team wants to route 10% of the prod stage traffic of a REST API to a new deployment, compare metrics,
      then promote it. Which feature should they use?
    options:
      A: "A canary release on the prod stage."
      B: "A new stage named prod-v2 with a Route 53 weighted record."
      C: "A usage plan with a 10% quota."
      D: "Stage variables pointing to two Lambda functions."
    answer: [A]
    explanation: |
      Stage canary settings send a percentage of requests to a canary deployment, with separate logs and
      metrics, and support promotion or rollback.
      B is possible with custom domains but more complex.
      C and D do not split traffic by percentage.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-014
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      An internal REST API must only be reachable from applications inside the company's VPCs, never from the
      internet. Which configuration achieves this?
    options:
      A: "An edge-optimized API with WAF geo-blocking."
      B: "A regional API with API keys."
      C: "A regional API with an IAM authorizer."
      D: "A private REST API accessed through an interface VPC endpoint (execute-api), with a resource policy allowing only that endpoint."
    answer: [D]
    explanation: |
      Private APIs are only reachable through interface VPC endpoints, and the resource policy restricts
      which endpoints and VPCs can call them.
      A blocks countries, not the internet.
      B and C remain publicly reachable.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-015
    domain: 4
    task: "4.1"
    difficulty: 2
    question: |
      CloudWatch shows that an API's average Latency is 1,200 ms while IntegrationLatency is 150 ms. Where is
      most of the time spent?
    options:
      A: "In the backend Lambda function."
      B: "In DNS resolution."
      C: "In the client's network connection."
      D: "Inside API Gateway itself (e.g. a slow Lambda authorizer or mapping templates), not in the backend integration."
    answer: [D]
    explanation: |
      Latency is measured by API Gateway from request receipt to response, and IntegrationLatency covers only
      the backend call. The difference (~1,050 ms) is spent in API Gateway: authorizers (possibly with cold
      starts), validation, mapping.
      A would show a high IntegrationLatency.
      B and C are not included in these metrics.
    refs: [book/src/ch06-api-gateway-appsync.md, book/src/ch22-troubleshooting.md]

  - id: apigw-016
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A mobile app needs a single endpoint to fetch exactly the fields it needs from DynamoDB, an Aurora
      database and a REST microservice, receive real-time updates when data changes, and work offline. Which
      service fits BEST?
    options:
      A: "AWS AppSync (GraphQL with resolvers, subscriptions and offline sync through Amplify)."
      B: "API Gateway REST API with Lambda proxy integrations."
      C: "Amazon EventBridge."
      D: "Amazon SQS with long polling."
    answer: [A]
    explanation: |
      AppSync provides GraphQL over several data sources, real-time subscriptions over WebSockets, and
      offline/sync support with the Amplify client libraries.
      B needs custom code for aggregation and real-time updates.
      C and D are not client-facing APIs.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-017
    domain: 4
    task: "4.1"
    difficulty: 2
    question: |
      A developer clicked "Enable CORS" on a REST API resource that uses a Lambda proxy integration. The
      preflight OPTIONS request now succeeds, but the browser still blocks the actual GET responses. What is
      missing?
    options:
      A: "The Lambda function must include the Access-Control-Allow-Origin header in its proxy responses."
      B: "The S3 bucket CORS configuration must be updated."
      C: "The API must be redeployed as an HTTP API."
      D: "An API key must be required on the GET method."
    answer: [A]
    explanation: |
      With proxy integrations, API Gateway passes the Lambda response through unchanged, so the function must
      return the CORS headers. The console's Enable CORS only configures OPTIONS (and non-proxy responses).
      B: no S3 involved.
      C is unnecessary.
      D is unrelated.
    refs: [book/src/ch06-api-gateway-appsync.md]

  - id: apigw-018
    domain: 3
    task: "3.3"
    difficulty: 1
    question: |
      A developer changed the integration of a REST API method in the console, but clients calling the prod
      stage URL still get the old behavior. What did the developer forget?
    options:
      A: "To flush the CloudFront cache."
      B: "To deploy the API to the prod stage (create a new deployment)."
      C: "To restart the Lambda function."
      D: "To enable detailed CloudWatch metrics."
    answer: [B]
    explanation: |
      REST API changes only become live when you create a deployment for a stage, because stages point to
      immutable deployment snapshots.
      A: no CloudFront invalidation is needed for this.
      C: Lambda has no restart.
      D is unrelated.
    refs: [book/src/ch06-api-gateway-appsync.md]
