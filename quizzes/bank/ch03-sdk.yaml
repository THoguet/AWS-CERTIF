chapter: ch03
topic: sdk
questions:
  - id: sdk-001
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      An application on an EC2 instance should use the instance profile role, but CloudTrail shows its API calls
      are made by an IAM user named legacy-deployer. The instance profile is correctly attached. What is the
      MOST likely explanation?
    options:
      A: "Instance profiles only work for the root user."
      B: "The SDK requires the region to be set before it can use instance profiles."
      C: "The instance metadata service always returns the credentials of the user who launched the instance."
      D: "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY environment variables are set on the instance, and they take precedence over the instance profile."
    answer: [D]
    explanation: |
      The default credential provider chain checks environment variables (and credential files) before the
      instance metadata service. Leftover keys win.
      A and C are false.
      B: a missing Region causes a different error and does not change the identity.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-002
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A reporting job lists objects in a bucket with a single call to ListObjectsV2 and always reports exactly
      1,000 objects, although the bucket holds 25,000. How should the developer fix the code?
    options:
      A: "Use a strongly consistent read option."
      B: "Enable S3 Transfer Acceleration."
      C: "Set MaxKeys to 25000."
      D: "Use the SDK paginator for list_objects_v2 (or loop on ContinuationToken) to read every page."
    answer: [D]
    explanation: |
      ListObjectsV2 returns at most 1,000 keys per call. Paginators follow the continuation token for you.
      A: S3 is already strongly consistent, and that is not the issue.
      B speeds up transfers, not listing.
      C: MaxKeys cannot exceed 1,000.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-003
    domain: 1
    task: "1.1"
    difficulty: 2
    question: |
      A Python application occasionally fails with ProvisionedThroughputExceededException when writing to
      DynamoDB during short bursts. The team wants the MOST resilient behavior with the LEAST custom code.
      What should they do?
    options:
      A: "Wrap every call in a loop that retries immediately until it succeeds."
      B: "Catch the exception and drop the write."
      C: "Configure the boto3 client with the standard (or adaptive) retry mode and a higher maximum number of attempts."
      D: "Create a new client for every retry."
    answer: [C]
    explanation: |
      The SDK retry modes already implement exponential backoff with jitter for throttling errors. Raising
      the attempt count makes bursts survivable with zero custom logic.
      A hammers the table and makes things worse.
      B loses data.
      D adds overhead without changing the retry behavior.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-004
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      A script calls sts.assume_role() and builds an S3 client with the returned AccessKeyId and
      SecretAccessKey. Every S3 call fails with "The security token included in the request is invalid".
      What is wrong?
    options:
      A: "S3 does not accept temporary credentials."
      B: "The role must be assumed with GetSessionToken instead."
      C: "The SessionToken from the AssumeRole response was not passed to the client."
      D: "The DurationSeconds parameter must be at least 3600."
    answer: [C]
    explanation: |
      Temporary credentials have three parts. Without the session token, AWS rejects the request.
      A is false.
      B: GetSessionToken does not assume roles.
      D: the minimum is 900 seconds, and the duration is unrelated to this error.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-005
    domain: 2
    task: "2.1"
    difficulty: 3
    question: |
      A long-running batch process copies temporary credentials obtained with aws sts assume-role into
      environment variables at startup. After about an hour it fails with ExpiredTokenException. Which change
      fixes this with the LEAST effort?
    options:
      A: "Catch ExpiredTokenException and restart the whole process."
      B: "Replace the role with long-term access keys of an IAM user."
      C: "Configure an assume-role profile (role_arn + source_profile) so that the SDK refreshes the role credentials automatically."
      D: "Request credentials valid for 30 days."
    answer: [C]
    explanation: |
      When the SDK assumes the role itself (assume-role profile or credential provider), it refreshes the
      credentials before they expire. Static values copied into environment variables never refresh.
      A works, but is crude and loses progress.
      B replaces temporary credentials with risky long-term keys.
      D: role sessions last at most 12 hours.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-006
    domain: 1
    task: "1.1"
    difficulty: 2
    question: |
      A developer must list the IDs of running EC2 instances among 20,000 instances with the AWS CLI, as fast
      as possible. Which approach is MOST efficient?
    options:
      A: "Download all instances with --output json and filter with grep."
      B: "Use only --query to filter on the state (client-side)."
      C: "Use --filters Name=instance-state-name,Values=running (server-side) and --query to project the IDs."
      D: "Use --dry-run to avoid pagination."
    answer: [C]
    explanation: |
      --filters reduces the data returned by the service. --query then shapes the output locally (JMESPath).
      A and B download everything first.
      D only checks permissions and returns no data.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-007
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      Developers use their own IAM users and must run CLI commands in a production account by assuming the
      role prod-admin, which requires MFA. How should their ~/.aws/config profile be configured?
    options:
      A: "role_arn = the prod-admin role ARN, source_profile = their default profile, and mfa_serial = their MFA device ARN."
      B: "aws_access_key_id and aws_secret_access_key of the prod-admin role."
      C: "region = us-east-1 and output = json; MFA is handled by the console only."
      D: "credential_process pointing to a script that prints the root user's keys."
    answer: [A]
    explanation: |
      An assume-role profile tells the CLI to call AssumeRole with the source profile's credentials, and
      mfa_serial makes it prompt for the MFA code.
      B: roles have no long-term keys.
      C does not assume anything.
      D uses root keys, which is terrible practice.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-008
    domain: 4
    task: "4.1"
    difficulty: 2
    question: |
      An on-premises server suddenly receives SignatureDoesNotMatch / RequestTimeTooSkewed errors on every
      AWS API call. Its credentials have not changed and work on other machines. What is the MOST likely cause?
    options:
      A: "The server's system clock has drifted by several minutes."
      B: "The account has reached its API request quota."
      C: "The server uses IPv6."
      D: "The IAM user has been deleted."
    answer: [A]
    explanation: |
      SigV4 signatures include a timestamp. A clock skew of more than about 5 minutes makes AWS reject the
      request. Synchronize the clock with NTP.
      B gives throttling errors.
      C is irrelevant.
      D would give InvalidClientTokenId.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-009
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A deployment script creates a DynamoDB table and immediately writes items to it, which fails with
      ResourceNotFoundException. What is the cleanest fix?
    options:
      A: "Retry the writes forever until they succeed."
      B: "Use a strongly consistent PutItem."
      C: "Add time.sleep(60) after CreateTable."
      D: "Call the table_exists waiter after CreateTable before writing."
    answer: [D]
    explanation: |
      Tables are created asynchronously (CREATING → ACTIVE). Waiters poll DescribeTable with proper delays
      and a maximum number of attempts.
      A has no upper bound.
      B: PutItem has no consistency option, and that is not the problem.
      C is fragile, either too long or too short.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-010
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      An IAM policy only allows deleting backups when MFA was used. A developer with an IAM user and an MFA
      device wants to perform this deletion from the CLI. Which STS API should they call first?
    options:
      A: "GetFederationToken."
      B: "GetSessionToken with the MFA device serial number and a token code."
      C: "AssumeRoleWithWebIdentity."
      D: "DecodeAuthorizationMessage."
    answer: [B]
    explanation: |
      GetSessionToken with SerialNumber/TokenCode returns temporary credentials marked as MFA-authenticated,
      so aws:MultiFactorAuthPresent is true.
      A is for federated users through a proxy.
      C exchanges OIDC tokens.
      D decodes error messages.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-011
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A team wants AI-generated code suggestions in their IDE, help writing unit tests for existing code, and
      automated security scans of their code, with the least setup. Which AWS service should they use?
    options:
      A: "Amazon Inspector"
      B: "Amazon Q Developer"
      C: "AWS Cloud9"
      D: "AWS CodeBuild"
    answer: [B]
    explanation: |
      Amazon Q Developer (which replaced CodeWhisperer) provides inline suggestions, chat, test generation,
      and security scanning in IDEs.
      A scans running workloads and images.
      C was a cloud IDE, closed to new customers.
      D runs builds.
    refs: [book/src/ch03-cli-sdk-sts.md]

  - id: sdk-012
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      A containerized application on Amazon ECS (Fargate) must write to DynamoDB. How should it obtain AWS
      credentials?
    options:
      A: "Bake an IAM user's access keys into the container image."
      B: "Assign an IAM task role. The SDK obtains temporary credentials from the container credentials endpoint automatically."
      C: "Pass access keys as plain environment variables in the task definition."
      D: "Use the task execution role from the application code."
    answer: [B]
    explanation: |
      The task role's credentials are served through the container credentials provider
      (AWS_CONTAINER_CREDENTIALS_RELATIVE_URI), which the SDK uses without code changes.
      A and C embed long-term secrets.
      D: the execution role is for the ECS agent (image pull, logs, secrets), not for application calls.
    refs: [book/src/ch03-cli-sdk-sts.md, book/src/ch18-beanstalk-containers.md]

  - id: sdk-013
    domain: 1
    task: "1.1"
    difficulty: 1
    question: |
      A developer on a locked-down laptop needs to run a few AWS CLI commands against their account using
      their console identity, without installing anything or creating access keys. What should they use?
    options:
      A: "An EC2 instance with an IAM user's access keys."
      B: "Amazon WorkSpaces."
      C: "The AWS Tools for PowerShell on the laptop."
      D: "AWS CloudShell from the AWS Management Console."
    answer: [D]
    explanation: |
      CloudShell is a browser-based shell already authenticated with the console identity, with the AWS CLI
      preinstalled.
      A requires access keys.
      B is a full virtual desktop, which is overkill.
      C requires installation.
    refs: [book/src/ch03-cli-sdk-sts.md]
