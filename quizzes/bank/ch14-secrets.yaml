chapter: ch14
topic: secrets
questions:
  - id: secrets-001
    domain: 2
    task: "2.3"
    difficulty: 1
    question: |
      An application connects to an Amazon RDS for PostgreSQL database. Security requires the database password
      to be rotated every 30 days automatically, with the LEAST custom code. Where should the password be stored?
    options:
      A: "An encrypted file in S3."
      B: "A Lambda environment variable updated monthly."
      C: "AWS Secrets Manager with automatic rotation enabled (managed rotation for RDS)."
      D: "SSM Parameter Store SecureString with a scheduled Lambda function written by the team."
    answer: [C]
    explanation: |
      Secrets Manager provides built-in rotation for RDS, Aurora, Redshift and DocumentDB.
      A and B require manual processes and expose the secret more widely.
      D: Parameter Store has no rotation, so the team would write and maintain it.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-002
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      A Lambda function reads a SecureString parameter with GetParameter(WithDecryption=True) and receives
      AccessDeniedException, although its role allows ssm:GetParameter on the parameter. The parameter uses a
      customer managed KMS key. What is missing?
    options:
      A: "The parameter must be in the Advanced tier."
      B: "ssm:PutParameter permission."
      C: "kms:Decrypt permission on that key for the function's role (allowed by the key policy)."
      D: "The function must run in a VPC."
    answer: [C]
    explanation: |
      Decrypting a SecureString calls KMS on behalf of the caller, so the role needs kms:Decrypt on the key.
      A is unrelated.
      B is a write permission.
      D is not required.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-003
    domain: 3
    task: "3.1"
    difficulty: 2
    question: |
      A team stores configuration as /app/prod/... and /app/dev/... parameters in Parameter Store. At startup the
      application must load all parameters of its environment, including nested ones and decrypted SecureStrings,
      with as few calls as possible. Which API should be used?
    options:
      A: "DescribeParameters."
      B: "GetParameterHistory."
      C: "GetParameter for each name, hard-coded in the application."
      D: "GetParametersByPath with Path=/app/prod/, Recursive=True and WithDecryption=True, following pagination."
    answer: [D]
    explanation: |
      GetParametersByPath loads a whole subtree (Recursive) and decrypts SecureStrings in one paginated loop.
      A returns metadata without values.
      B returns the versions of one parameter.
      C requires maintaining a list of names.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-004
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      A team needs to store about 200 non-secret configuration values and a few API keys per environment, at the
      LOWEST cost. Automatic rotation is not required. Which service fits BEST?
    options:
      A: "Amazon DynamoDB with a custom encryption library."
      B: "AWS Secrets Manager for all values."
      C: "SSM Parameter Store (Standard tier), with SecureString for the API keys."
      D: "AWS AppConfig hosted configuration for the API keys."
    answer: [C]
    explanation: |
      Standard parameters are free (up to 10,000, 4 KB each), and SecureString encrypts secrets with KMS.
      A adds custom work.
      B costs about $0.40 per secret per month and is meant for secrets that need rotation or cross-account sharing.
      D is meant for configuration and feature flags, not secret storage.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-005
    domain: 3
    task: "3.4"
    difficulty: 2
    question: |
      A product team wants to enable a new checkout flow for 10% of users, increase gradually over an hour, and
      roll back automatically if the checkout error alarm fires, without redeploying the application. Which
      service should they use?
    options:
      A: "A Lambda environment variable updated by a script."
      B: "Parameter Store with parameter policies."
      C: "CloudFormation stack updates."
      D: "AWS AppConfig feature flags with a linear deployment strategy and a CloudWatch alarm as a rollback trigger."
    answer: [D]
    explanation: |
      AppConfig deploys configuration gradually with bake time, validates it, and rolls back automatically on
      alarms. Feature flags are a first-class profile type.
      A and C redeploy or restart the application.
      B has no gradual rollout or rollback.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-006
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      A custom Secrets Manager rotation function is being implemented for a third-party service. In which order
      does Secrets Manager invoke the rotation steps?
    options:
      A: "createSecret, setSecret, testSecret, finishSecret"
      B: "setSecret, createSecret, finishSecret, testSecret"
      C: "testSecret, createSecret, setSecret, finishSecret"
      D: "createSecret, finishSecret, setSecret, testSecret"
    answer: [A]
    explanation: |
      createSecret stores a new AWSPENDING version. setSecret applies it to the service. testSecret verifies it
      works. finishSecret moves the AWSCURRENT label to the new version (the old one becomes AWSPREVIOUS).
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-007
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A Lambda function calls GetSecretValue on every invocation (millions per day), which adds latency and cost.
      Which solution improves this with the LEAST code?
    options:
      A: "Store the secret in a plaintext environment variable."
      B: "Call GetSecretValue in a separate thread."
      C: "Use the AWS Parameters and Secrets Lambda Extension (or a caching client) to cache the secret locally with a TTL."
      D: "Hard-code the secret in the function package."
    answer: [C]
    explanation: |
      The extension serves cached secrets from localhost with a configurable TTL, so rotation is still picked
      up. Caching clients do the same in code.
      A and D expose the secret and break rotation.
      B still makes every call.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-008
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      A CloudFormation template creates an RDS instance. The master password must not appear in the template,
      in parameters or in stack outputs. Which approach is BEST?
    options:
      A: "Put the password in the stack's Outputs with NoEcho."
      B: "Use a dynamic reference such as {{resolve:secretsmanager:prod/db:SecretString:password}}, or let RDS manage the master password in Secrets Manager."
      C: "Hard-code the password in the template and restrict access to the repository."
      D: "Pass the password as a template parameter with a default value."
    answer: [B]
    explanation: |
      Dynamic references resolve secrets at deployment time without storing them in the template.
      ManageMasterUserPassword lets RDS create and rotate the secret itself.
      A: NoEcho applies to parameters, and outputs should never hold secrets.
      C and D expose the password.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-009
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      A Lambda function's database password is stored in an environment variable encrypted at rest with the
      default AWS managed key. Why does a security review flag this?
    options:
      A: "Environment variables are not encrypted at rest."
      B: "Any principal allowed to view the function configuration sees the value in plaintext, and the password cannot be rotated without redeploying."
      C: "Environment variables are limited to 256 bytes."
      D: "Environment variables are visible to other AWS accounts."
    answer: [B]
    explanation: |
      Encryption at rest does not stop authorized readers of the configuration from seeing the value. Use
      Secrets Manager or Parameter Store, or at least encryption helpers with a customer managed key.
      A: they are encrypted at rest.
      C: the limit is 4 KB in total.
      D is false.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-010
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      Application logs sent to CloudWatch Logs sometimes contain customers' email addresses and credit card
      numbers. Which measures reduce the exposure of this sensitive data? (Choose TWO.)
    options:
      A: "Attach a CloudWatch Logs data protection policy to the log group to detect and mask sensitive data."
      B: "Sanitize or mask sensitive fields in the application before logging."
      C: "Increase the log retention to 10 years."
      D: "Enable detailed monitoring on the log group."
      E: "Grant logs:Unmask to all developers."
    answer: [A, B]
    explanation: |
      Masking in code (defense at the source) plus data protection policies (a safety net at ingestion) reduce
      exposure of PII and card data.
      C keeps the data longer.
      D does not exist for log groups.
      E defeats masking.
    refs: [book/src/ch14-secrets-config.md]

  - id: secrets-011
    domain: 2
    task: "2.3"
    difficulty: 2
    question: |
      An ECS task needs a database password at startup. Which task definition configuration is the MOST secure?
    options:
      A: "The password baked into the container image."
      B: "The password passed as a command-line argument in the task definition."
      C: "An environment entry containing the password."
      D: "A secrets entry with valueFrom set to the Secrets Manager secret or SSM parameter ARN, with the task execution role allowed to read it."
    answer: [D]
    explanation: |
      ECS injects secrets as environment variables at container start, from Secrets Manager or Parameter Store,
      using the task execution role.
      A, B and C put the password in plaintext in the definition, the image or the process list.
    refs: [book/src/ch14-secrets-config.md, book/src/ch18-beanstalk-containers.md]

  - id: secrets-012
    domain: 2
    task: "2.3"
    difficulty: 1
    question: |
      A company wants to discover which S3 buckets contain personally identifiable information (PII) such as names,
      addresses and passport numbers. Which service should it use?
    options:
      A: "Amazon Macie"
      B: "AWS Config"
      C: "Amazon GuardDuty"
      D: "Amazon Inspector"
    answer: [A]
    explanation: |
      Macie uses machine learning and pattern matching to find sensitive data in S3.
      B tracks resource configurations.
      C detects threats from logs and network activity.
      D scans workloads for vulnerabilities.
    refs: [book/src/ch14-secrets-config.md]
