chapter: ch08
topic: caching
questions:
  - id: caching-001
    domain: 1
    task: "1.3"
    difficulty: 2
    question: |
      An e-commerce app uses lazy loading with ElastiCache and a 1-hour TTL for product prices. After a price
      change, customers keep seeing the old price for up to an hour. Which change gives fresh prices on reads
      while keeping the cache effective?
    options:
      A: "Also use write-through: update (or delete) the cache entry whenever the price is updated in the database."
      B: "Increase the TTL to 24 hours."
      C: "Remove the TTL entirely."
      D: "Switch from Redis to Memcached."
    answer: [A]
    explanation: |
      Write-through (or invalidation on write) keeps the cache in sync on updates, while lazy loading still
      fills it on misses.
      B and C make staleness worse.
      D changes the engine, not the strategy.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-002
    domain: 1
    task: "1.3"
    difficulty: 1
    question: |
      Which statement describes the lazy loading (cache-aside) strategy?
    options:
      A: "The application reads the cache first. On a miss it reads the database and writes the result to the cache."
      B: "Every database write is also written to the cache immediately."
      C: "The cache pre-loads the entire database at startup."
      D: "The database pushes changes to the cache through triggers."
    answer: [A]
    explanation: |
      Cache-aside populates the cache on demand, so only requested data is cached. The downsides are a miss
      penalty and possibly stale data.
      B is write-through.
      C and D are not the lazy loading strategy.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-003
    domain: 1
    task: "1.3"
    difficulty: 2
    question: |
      A web application runs on an Auto Scaling group behind an ALB and stores user sessions in the instances'
      memory, so users are logged out when instances are replaced. Which solution makes the application stateless
      with the LEAST latency impact?
    options:
      A: "Store sessions in Amazon ElastiCache (Redis/Valkey) and read them on each request."
      B: "Enable sticky sessions on the ALB."
      C: "Store sessions in S3 Glacier."
      D: "Store sessions on the instances' EBS volumes."
    answer: [A]
    explanation: |
      An in-memory shared store makes sessions available to every instance with sub-millisecond latency
      (DynamoDB is another option).
      B still loses sessions when an instance dies.
      C is far too slow.
      D is still per-instance.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-004
    domain: 1
    task: "1.3"
    difficulty: 2
    question: |
      A game needs a real-time leaderboard ranking millions of players by score, with fast top-N queries. Which
      service and feature fit BEST?
    options:
      A: "Amazon ElastiCache for Redis (or Valkey) with sorted sets."
      B: "Amazon ElastiCache for Memcached."
      C: "Amazon S3 Select."
      D: "Amazon RDS read replicas."
    answer: [A]
    explanation: |
      Redis/Valkey sorted sets keep members ordered by score, with logarithmic-time updates and range queries.
      B only supports simple key/value pairs.
      C is not a database.
      D is slower and needs manual ranking queries.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-005
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      Hundreds of concurrent Lambda functions connect to an Aurora PostgreSQL cluster. During traffic spikes the
      database rejects connections with "too many clients". What is the BEST solution?
    options:
      A: "Put Amazon RDS Proxy between the functions and the database to pool and share connections."
      B: "Add more Aurora read replicas."
      C: "Increase the Lambda timeout."
      D: "Open a new connection in every invocation and close it at the end."
    answer: [A]
    explanation: |
      RDS Proxy maintains a pool of connections and multiplexes many client connections onto it. It also
      speeds up failovers and supports IAM authentication.
      B does not reduce writer connections.
      C is unrelated.
      D makes the problem worse.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-006
    domain: 1
    task: "1.3"
    difficulty: 1
    question: |
      A reporting dashboard runs heavy read queries that slow down the primary RDS MySQL instance used by the
      application. What should the developer do?
    options:
      A: "Create a read replica and send the dashboard's queries to the replica endpoint."
      B: "Enable Multi-AZ and send the dashboard queries to the standby."
      C: "Increase the backup retention period."
      D: "Enable Performance Insights."
    answer: [A]
    explanation: |
      Read replicas scale read traffic (asynchronous replication, possibly slightly stale data).
      B: the classic Multi-AZ standby cannot serve reads, it exists for high availability.
      C and D do not offload reads.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-007
    domain: 2
    task: "2.1"
    difficulty: 2
    question: |
      Premium members stream videos made of thousands of small segment files from a private S3 bucket through
      CloudFront. Access must be restricted to members. Which solution fits BEST?
    options:
      A: "Keep the bucket private with Origin Access Control and issue CloudFront signed cookies to members."
      B: "Generate an S3 presigned URL for every segment."
      C: "Make the bucket public and obscure the file names."
      D: "Use CloudFront signed URLs, one per segment, distributed in the HTML page."
    answer: [A]
    explanation: |
      Signed cookies authorize many files at once, which fits streaming. OAC keeps S3 reachable only through
      CloudFront.
      B bypasses CloudFront and is impractical.
      C is insecure.
      D works for single files but is impractical for thousands of segments.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-008
    domain: 4
    task: "4.3"
    difficulty: 2
    question: |
      A CloudFront distribution must add security headers to every response and redirect some legacy URLs. The
      logic is simple, needs no network calls, and must run at very high volume at minimal cost. What should the
      developer use?
    options:
      A: "CloudFront Functions on viewer request/response events."
      B: "Lambda@Edge on origin request events."
      C: "An API Gateway in front of CloudFront."
      D: "AWS WAF custom rules."
    answer: [A]
    explanation: |
      CloudFront Functions are lightweight JavaScript functions running in under a millisecond at the edge,
      ideal for header manipulation and redirects, and much cheaper than Lambda@Edge.
      B suits heavier logic with network access.
      C and D are not meant for this.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-009
    domain: 1
    task: "1.3"
    difficulty: 2
    question: |
      Several Lambda functions must read and write the same large set of files with POSIX semantics (shared
      model files and intermediate results). Which storage option fits?
    options:
      A: "Amazon EFS mounted on the functions."
      B: "Each function's /tmp directory."
      C: "Amazon EBS volumes attached to the functions."
      D: "Lambda environment variables."
    answer: [A]
    explanation: |
      EFS is a shared, persistent NFS file system that Lambda functions (in a VPC) can mount.
      B is ephemeral and private to each execution environment.
      C cannot be attached to Lambda.
      D is limited to 4 KB.
    refs: [book/src/ch08-caching-databases-cdn.md]

  - id: caching-010
    domain: 1
    task: "1.3"
    difficulty: 2
    question: |
      Analysts want to run ad hoc SQL queries over terabytes of Parquet log files stored in S3, without managing
      servers or loading the data into a database. Which service should they use?
    options:
      A: "Amazon Athena"
      B: "Amazon RDS for PostgreSQL"
      C: "Amazon DynamoDB with PartiQL"
      D: "Amazon ElastiCache"
    answer: [A]
    explanation: |
      Athena is serverless SQL directly on S3, priced per data scanned. Columnar formats like Parquet and
      partitioning reduce cost.
      B and C require loading the data.
      D is an in-memory cache.
    refs: [book/src/ch08-caching-databases-cdn.md]
