AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: DVA-C02 lab04 - the application deployed by the pipeline (staging and prod stacks)

Parameters:
  Stage:
    Type: String
    AllowedValues: [staging, prod]

Resources:
  HelloFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: hello.handler
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 5
      Environment:
        Variables:
          STAGE: !Ref Stage
      Events:
        Hello:
          Type: HttpApi                   # HTTP API, default stage, auto-deployed
          Properties:
            Path: /hello
            Method: get

Outputs:
  HelloUrl:
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/hello"
