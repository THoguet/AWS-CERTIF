chapter = "ch09"
domain = "4.3"
hint = '''
sns.subscribe(TopicArn=..., Protocol="sqs", Endpoint=queue_arn, Attributes={"FilterPolicy": json.dumps({...}), "RawMessageDelivery": "true"}).
