publish(TopicArn=..., Message=..., MessageAttributes={"event_type": {"DataType": "String", "StringValue": ...}, ...}).'''

[[exercises]]
name = "events_1"
path = "exercises/08_messaging/events_1_event_patterns.py"
chapter = "ch09"
domain = "1.1"
hint = '''
Patterns match on fields of the event envelope ("source", "detail-type") and inside "detail". Leaf values are always LISTS.
