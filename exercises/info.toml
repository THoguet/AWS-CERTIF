sfn.send_task_success(taskToken=..., output=json.dumps({...})) or sfn.send_task_failure(taskToken=..., error="Rejected", cause=...).'''

[[exercises]]
name = "res_1"
path = "exercises/10_resilience/res_1_circuit_breaker.py"
chapter = "ch11"
domain = "1.1"
hint = '''
Keep state ("closed"/"open"/"half_open"), the number of consecutive failures and the time the circuit opened (self.clock()).
Open: if clock() - opened_at < reset_timeout, raise CircuitOpenError WITHOUT calling fn. Otherwise move to half_open and allow one trial call.
On success: failures = 0 and state = closed. On failure: failures += 1. Open the circuit (and restart the timer) if half_open or failures >= threshold.'''

[[exercises]]
