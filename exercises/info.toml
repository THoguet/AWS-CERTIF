path = "exercises/08_messaging/sqs_3_fifo.py"
chapter = "ch09"
domain = "1.1"
hint = '''
FIFO queue names must end with ".fifo". Attributes {"FifoQueue": "true", "ContentBasedDeduplication": "true"}.
