hint = '''
describe_stream(StreamName=...)["StreamDescription"]["Shards"] lists the shards. Read each one.
get_shard_iterator(StreamName=..., ShardId=..., ShardIteratorType="TRIM_HORIZON"), then loop get_records(ShardIterator=it). Stop when a call returns no records.
Record "Data" is bytes. json.loads accepts bytes directly.'''

[[exercises]]
name = "kinesis_3"
path = "exercises/09_streaming/kinesis_3_shard_math.py"
chapter = "ch10"
domain = "1.1"
hint = '''
Writes per shard: 1 MB/s AND 1,000 records/s. Shards for writes = max(ceil(rps / 1000), ceil(rps * kb / 1024)).
Shared-throughput reads: 2 MB/s per shard shared by ALL consumers → ceil(rps * kb * consumers / 2048).
Enhanced fan-out: each consumer gets its own 2 MB/s per shard → ceil(rps * kb / 2048), whatever the number of consumers.'''

[[exercises]]
name = "sfn_1"
path = "exercises/09_streaming/sfn_1_retry_catch.py"
chapter = "ch10"
domain = "1.1"
hint = '''
Retry: [{"ErrorEquals": ["Lambda.ServiceException", "Lambda.TooManyRequestsException", "States.Timeout"], "IntervalSeconds": 2, "MaxAttempts": 3, "BackoffRate": 2.0}].
Catch: [{"ErrorEquals": ["States.ALL"], "ResultPath": "$.error", "Next": "NotifyFailure"}]. ResultPath keeps the original input and adds the error under $.error.
Choice: {"Type": "Choice", "Choices": [{"Variable": "$.amount", "NumericGreaterThanEquals": 1000, "Next": "ManualReview"}], "Default": "Ship"}.'''

