[[exercises]]
name = "kinesis_1"
path = "exercises/09_streaming/kinesis_1_producer.py"
chapter = "ch10"
domain = "1.1"
hint = '''
Send in chunks of at most 500 records: put_records(StreamName=..., Records=[{"Data": bytes, "PartitionKey": user_id}, ...]).
