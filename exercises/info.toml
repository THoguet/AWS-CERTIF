chapter = "ch13"
domain = "2.2"
hint = '''
kms.encrypt(KeyId=..., Plaintext=data.encode(), EncryptionContext={"customer_id": customer_id})["CiphertextBlob"].
kms.decrypt(CiphertextBlob=blob, EncryptionContext={...})["Plaintext"]. Decrypt does not need the KeyId for symmetric keys, because it is stored in the blob.
Raise ValueError when len(plaintext) > 4096 bytes. Use envelope encryption (next exercise) for bigger data.'''

[[exercises]]
name = "kms_2"
path = "exercises/12_kms/kms_2_envelope_encryption.py"
chapter = "ch13"
domain = "2.2"
hint = '''
kms.generate_data_key(KeyId=..., KeySpec="AES_256") returns "Plaintext" (use it, then forget it) and "CiphertextBlob" (store it).
AESGCM(plaintext_key).encrypt(nonce, data, None) with nonce = os.urandom(12). Store the nonce next to the ciphertext.
To decrypt: kms.decrypt(CiphertextBlob=envelope["encrypted_key"])["Plaintext"] gives the data key back. Then AESGCM(key).decrypt(nonce, ciphertext, None).'''

