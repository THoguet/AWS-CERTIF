path = "exercises/10_resilience/res_2_serialization.py"
chapter = "ch11"
domain = "1.3"
hint = '''
boto3's DynamoDB resource refuses Python floats. Use Decimal(str(value)): Decimal(19.99) keeps the binary float error, Decimal("19.99") does not.
Store datetimes as ISO 8601 strings in UTC (datetime.isoformat()). They sort chronologically, which suits sort keys.
json.dumps cannot encode Decimal. Pass default=... converting integral Decimals to int and the others to float.'''

