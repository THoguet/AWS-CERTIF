json.dumps(event, sort_keys=True) gives identical bodies for identical events, which content-based deduplication relies on.'''

[[exercises]]
name = "sqs_4"
path = "exercises/08_messaging/sqs_4_large_payloads.py"
chapter = "ch09"
domain = "1.1"
hint = '''
If len(payload) > MAX_INLINE_BYTES: s3.put_object(Bucket=bucket, Key=f"payloads/{uuid.uuid4()}", Body=payload), then send a small JSON pointer.
Mark pointer messages with a message attribute (e.g. "claim-check" = "true") so the consumer knows to fetch from S3.
