path = "exercises/18_optimization/opt_1_lambda_memory_cost.py"
chapter = "ch23"
domain = "4.3"
hint = '''
GB-seconds per invocation = (memory_mb / 1024) × (duration_ms / 1000). Lambda bills duration rounded up to the next millisecond.
Cost per million = 1e6 × (GB-seconds × PRICE_PER_GB_SECOND + PRICE_PER_REQUEST).
cheapest_memory: keep only configurations whose duration <= max_latency_ms (when given), then take the lowest cost.'''

